<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        function isIgnoredExtensionError(err) {
          if (!err) return false;
          var msg = String(err.message || err).toLowerCase();
          var stack = String(err.stack || '').toLowerCase();
          return (
            msg.indexOf('metamask') !== -1 ||
            msg.indexOf('failed to connect') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('inpage.js') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnoredExtensionError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('error', function(event) {
          var err = event.error;
          var msg = event.message || '';
          var fn = event.filename || '';
          if (
            isIgnoredExtensionError(err) ||
            isIgnoredExtensionError(msg) ||
            fn.indexOf('chrome-extension://') !== -1 ||
            fn.indexOf('inpage.js') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>Decent School Furniture - Quality Furniture. Better Learning.</title>
